buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // GEO-02/03: required by app/build.gradle's "apply plugin:
        // com.google.gms.google-services" line below.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The old @rnmapbox/maps setup needed a private, authenticated Maven repo
// here (Mapbox's Android SDK binaries require a secret downloads token,
// separate from the public runtime access token) - see git history if you
// ever need that block back. @maplibre/maplibre-react-native's Android SDK
// publishes to Maven Central like any other public dependency, so no
// credentialed repo or token is needed at all.