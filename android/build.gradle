buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // GEO-02/03: required by app/build.gradle's "apply plugin:
        // com.google.gms.google-services" line below.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Required for @rnmapbox/maps: the Android SDK binaries are hosted on a
// private, authenticated Maven repo, separate from the public runtime
// access token used inside the app. See docs/mapbox-setup.md - the actual
// secret token must NEVER be committed here; it's read from your machine's
// own ~/.gradle/gradle.properties (or the MAPBOX_DOWNLOADS_TOKEN env var),
// not from this repo's android/gradle.properties.
allprojects {
    repositories {
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication { basic(BasicAuthentication) }
            credentials {
                username = "mapbox"
                password = project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: System.getenv('MAPBOX_DOWNLOADS_TOKEN') ?: ""
            }
        }
    }
}